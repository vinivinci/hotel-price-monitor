name: Trivago Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 twilio python-dotenv

      - name: Executar o monitor do Trivago
        run: python trivago-monitor.py
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          TRIVAGO_URL: ${{ secrets.TRIVAGO_URL }}
          HOTEL_NAME: ${{ secrets.HOTEL_NAME }}
          PRICE_THRESHOLD: ${{ secrets.PRICE_THRESHOLD }}
